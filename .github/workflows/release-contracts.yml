name: Release verified contracts

# SEP-55: builds a contract in GitHub Actions and publishes an attestation, so
# anyone can trace its on-chain WASM hash back to this repository. Deploy the
# WASM attached to the release. Run with a tag like split_protocol-v1.
on:
  push:
    tags:
      - "split_protocol-v*"
      - "time_vault-v*"
      - "proof_of_vault_verifier-v*"
      - "consistent_saving_verifier-v*"

permissions:
  id-token: write
  contents: write
  attestations: write

jobs:
  split_protocol:
    if: startsWith(github.ref_name, 'split_protocol-v')
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@e43b241f114bcf02151c30d61088506c6ad3ae0b # v25.1.0
    with:
      release_name: ${{ github.ref_name }}
      relative_path: contracts
      package: split-protocol
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}

  time_vault:
    if: startsWith(github.ref_name, 'time_vault-v')
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@e43b241f114bcf02151c30d61088506c6ad3ae0b # v25.1.0
    with:
      release_name: ${{ github.ref_name }}
      relative_path: contracts
      package: time-vault
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}

  proof_of_vault_verifier:
    if: startsWith(github.ref_name, 'proof_of_vault_verifier-v')
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@e43b241f114bcf02151c30d61088506c6ad3ae0b # v25.1.0
    with:
      release_name: ${{ github.ref_name }}
      relative_path: zk/contracts/proof_of_vault_verifier
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}

  consistent_saving_verifier:
    if: startsWith(github.ref_name, 'consistent_saving_verifier-v')
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@e43b241f114bcf02151c30d61088506c6ad3ae0b # v25.1.0
    with:
      release_name: ${{ github.ref_name }}
      relative_path: zk/contracts/consistent_saving_verifier
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}
